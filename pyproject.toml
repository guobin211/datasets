[project]
name = "datasets"
version = "0.1.0"
description = "python scripts dependencies"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 180
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E741"]

[tool.pyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
